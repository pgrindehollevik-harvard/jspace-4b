[project]
name = "hw0"
version = "0.1.0"
description = "CS 2881 HW0: J-space ablation vs chain-of-thought across problem difficulty on Qwen3-4B"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers>=5.5",
    "datasets",
    "math-verify[antlr4_13_2]",
    "matplotlib",
    "huggingface_hub",
    "statsmodels",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hw0"]
